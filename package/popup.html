<!DOCTYPE html>
<html
    lang="en"
    class="bg-white"
>

<head>
    <link
        rel="stylesheet"
        href="tailwind.css"
    />
    <link
        rel="stylesheet"
        href="styles.css"
    />
    <script src="popup.js"></script>
</head>

<body class="w-[17rem] min-h-[140px] bg-gray-100 p-4 text-sm text-gray-800 font-sans">

    <div id="container">

        <p
            class="mb-4 bg-yellow-100 px-2 py-1 rounded border border-gray-300 text-xs hidden"
            id="alert"
        >Lorem ipsum</p>

        <div
            id="buttons"
            class="flex flex-col gap-3"
        >
            <div>
                <div class="flex gap-2 items-center justify-between">
                    Files
                    <div class="flex gap-2">
                        <button
                            id="fold"
                            class="px-2 py-1 bg-white border border-gray-300 rounded hover:bg-slate-100 active:bg-slate-200 transition-colors"
                        >Fold</button>
                        <button
                            id="unfold"
                            class="px-2 py-1 bg-white border border-gray-300 rounded hover:bg-slate-100 active:bg-slate-200 transition-colors"
                        >Unfold</button>
                    </div>
                </div>
            </div>
            <hr>
            <div class="flex gap-2 items-center justify-between">
                Mark files
                <div class="flex gap-2">
                    <button
                        id="mark"
                        class="px-2 py-1 bg-white border border-gray-300 rounded hover:bg-slate-100 active:bg-slate-200 transition-colors"
                    >Viewed</button>
                    <button
                        id="unmark"
                        class="px-2 py-1 bg-white border border-gray-300 rounded hover:bg-slate-100 active:bg-slate-200 transition-colors"
                    >Not Viewed</button>
                </div>
            </div>
            <hr>
            <div>
                <div class="flex gap-2 items-center justify-between">
                    Sort by
                </div>
                <div class="pl-4 mt-2 flex flex-col gap-2">
                    <div class="flex gap-2 items-center grow justify-between">
                        changes
                        <div>
                            <button
                                id="sort-changes-asc"
                                class="px-2 py-1 bg-white border border-gray-300 rounded hover:bg-slate-100 active:bg-slate-200 transition-colors"
                            >ASC</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
